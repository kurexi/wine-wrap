[workspace]
resolver = "2"
members = ["crates/winewrap-core", "crates/winewrap-cli", "crates/winewrap-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hashspace-apps/wine-wrap"
rust-version = "1.88"

[workspace.dependencies]
winewrap-core = { path = "crates/winewrap-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
ureq = { version = "3", features = ["platform-verifier"] }
serde_json = "1"
tar = "0.4"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz", "optimization"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
eframe = "0.37"
rfd = "0.17"
