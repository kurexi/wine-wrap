[package]
name = "winewrap-gui"
description = "Desktop front end for WineWrap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "WineWrap"
path = "src/main.rs"

[dependencies]
winewrap-core.workspace = true
eframe.workspace = true
rfd.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# `cargo bundle --release -p winewrap-gui` produces WineWrap.app
[package.metadata.bundle]
name = "WineWrap"
identifier = "com.wine-wrap.WineWrap"
category = "public.app-category.games"
short_description = "Run Windows games and Steam on macOS with Wine"
osx_minimum_system_version = "13.0"
