name: Release

# Push a tag like `v0.2.0` (matching the version in Cargo.toml) to publish a
# GitHub release with a macOS .dmg, macOS CLI tarball and Linux CLI tarball.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          tag="${TAG#v}"
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          if [[ "$manifest" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    # ci.yml's package job declares contents: write (it is skipped here, but
    # a called workflow may not request more than the caller grants).
    permissions:
      contents: write
    with:
      skip_package: true

  # Build jobs upload straight to a draft release instead of passing files
  # around as Actions artifacts, which this account has no storage for.
  draft:
    name: Create draft release
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; re-using it."
            exit 0
          fi
          flags=(--draft --verify-tag --generate-notes --title "WineWrap ${{ needs.verify.outputs.version }}")
          if [[ "${{ needs.verify.outputs.prerelease }}" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}"

  macos:
    name: Build macOS
    needs: [verify, draft]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # Optional Developer ID signing + notarization. Without these secrets
      # the app is ad-hoc signed and users must clear Gatekeeper's quarantine
      # flag on first launch (see README, "Running an unsigned build").
      - name: Import signing certificate
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$CERT_P12_BASE64" || -z "$SIGNING_IDENTITY" ]]; then
            echo "No signing certificate configured; using ad-hoc signing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          MACOS_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/package-macos.sh universal

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.identity != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber

  linux:
    name: Build Linux CLI
    needs: [verify, draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cargo build --release --locked -p winewrap-cli
          name="winewrap-$VERSION-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/winewrap README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber

  publish:
    name: Publish GitHub release
    needs: [verify, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Add checksums
        run: |
          gh release download "$TAG" --dir dist --skip-existing
          rm -f dist/SHA256SUMS.txt
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" dist/SHA256SUMS.txt --clobber
      - name: Publish
        run: gh release edit "$TAG" --draft=false
