name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Lets the release workflow run the same checks before publishing.
  workflow_call:
    inputs:
      skip_package:
        description: Skip the macOS package job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
          - name: macOS x86_64
            os: macos-15-intel
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: CLI smoke test
        shell: bash
        env:
          WINEWRAP_HOME: ${{ runner.temp }}/winewrap-home
        run: |
          cargo run --locked -q -p winewrap-cli -- --version
          cargo run --locked -q -p winewrap-cli -- bottle list
          cargo run --locked -q -p winewrap-cli -- doctor || true

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from manifests
        id: msrv
        run: |
          echo "core=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "gui=$(sed -n 's/^rust-version = "\([^"]*\)".*/\1/p' crates/winewrap-gui/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.core }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.gui }}
      - uses: Swatinem/rust-cache@v2
      - name: Check core + CLI on Rust ${{ steps.msrv.outputs.core }}
        run: cargo +${{ steps.msrv.outputs.core }} check --locked -p winewrap-core -p winewrap-cli --all-targets
      - name: Check GUI on Rust ${{ steps.msrv.outputs.gui }}
        run: cargo +${{ steps.msrv.outputs.gui }} check --locked -p winewrap-gui

  deny:
    name: Dependencies (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  package:
    name: Package macOS app
    needs: [clippy, test]
    # Skipped when the release workflow calls CI, since it packages on its own.
    # (A missing input is null, and !null is true, so other events still package.)
    if: ${{ !inputs.skip_package }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal .app, .dmg and CLI tarball (ad-hoc signed)
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package-macos.sh universal
      - uses: actions/upload-artifact@v4
        with:
          name: winewrap-macos-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test the packaged app
        env:
          WINEWRAP_HOME: ${{ runner.temp }}/winewrap-home
        run: |
          hdiutil attach dist/*.dmg -mountpoint /tmp/winewrap-dmg -nobrowse
          cp -R /tmp/winewrap-dmg/WineWrap.app "$RUNNER_TEMP/"
          hdiutil detach /tmp/winewrap-dmg
          app="$RUNNER_TEMP/WineWrap.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/WineWrap"
          "$app/Contents/MacOS/winewrap" --version
          "$app/Contents/MacOS/winewrap" bottle list

          # Launch the GUI and make sure it stays up and draws a window.
          "$app/Contents/MacOS/WineWrap" > "$RUNNER_TEMP/gui.log" 2>&1 &
          pid=$!
          sleep 20
          screencapture -x "$RUNNER_TEMP/screenshot.png" || echo "screencapture unavailable"
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::WineWrap exited during startup"
            cat "$RUNNER_TEMP/gui.log"
            exit 1
          fi
          kill "$pid"
          cat "$RUNNER_TEMP/gui.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-smoke-test
          path: |
            ${{ runner.temp }}/screenshot.png
            ${{ runner.temp }}/gui.log
          if-no-files-found: ignore
          retention-days: 7
