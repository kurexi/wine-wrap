name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the unsigned build as the "dev-unsigned" GitHub pre-release
        type: boolean
        default: true
  # Lets the release workflow run the same checks before publishing.
  workflow_call:
    inputs:
      skip_package:
        description: Skip the macOS package job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
          - name: macOS x86_64
            os: macos-15-intel
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: CLI smoke test
        shell: bash
        env:
          WINEWRAP_HOME: ${{ runner.temp }}/winewrap-home
        run: |
          cargo run --locked -q -p winewrap-cli -- --version
          cargo run --locked -q -p winewrap-cli -- bottle list
          cargo run --locked -q -p winewrap-cli -- doctor || true

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from manifests
        id: msrv
        run: |
          echo "core=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "gui=$(sed -n 's/^rust-version = "\([^"]*\)".*/\1/p' crates/winewrap-gui/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.core }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.gui }}
      - uses: Swatinem/rust-cache@v2
      - name: Check core + CLI on Rust ${{ steps.msrv.outputs.core }}
        run: cargo +${{ steps.msrv.outputs.core }} check --locked -p winewrap-core -p winewrap-cli --all-targets
      - name: Check GUI on Rust ${{ steps.msrv.outputs.gui }}
        run: cargo +${{ steps.msrv.outputs.gui }} check --locked -p winewrap-gui

  deny:
    name: Dependencies (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  e2e:
    name: End-to-end on macOS (install Wine, create a bottle)
    needs: [test]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      WINEWRAP_HOME: ${{ runner.temp }}/winewrap-home
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p winewrap-cli
      - name: Install Wine with WineWrap (no Homebrew)
        run: target/debug/winewrap runtime install stable
      - run: target/debug/winewrap runtime list
      - name: Create a bottle
        run: target/debug/winewrap -v bottle create E2E
      - name: Check the bottle
        run: |
          target/debug/winewrap bottle list
          test -f "$WINEWRAP_HOME/data/bottles/E2E/system.reg"
          target/debug/winewrap kill E2E || true

  package:
    name: Package macOS app
    needs: [clippy, test]
    # Skipped when the release workflow calls CI, since it packages on its own.
    # (A missing input is null, and !null is true, so other events still package.)
    if: ${{ !inputs.skip_package }}
    runs-on: macos-latest
    permissions:
      # Needed to publish the dev-unsigned pre-release.
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal .app, .dmg and CLI tarball (ad-hoc signed)
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package-macos.sh universal
      - name: Smoke-test the packaged app
        timeout-minutes: 10
        env:
          WINEWRAP_HOME: ${{ runner.temp }}/winewrap-home
        run: |
          hdiutil attach dist/*.dmg -mountpoint /tmp/winewrap-dmg -nobrowse
          cp -R /tmp/winewrap-dmg/WineWrap.app "$RUNNER_TEMP/"
          hdiutil detach /tmp/winewrap-dmg
          app="$RUNNER_TEMP/WineWrap.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          cli="$app/Contents/Helpers/winewrap"
          lipo -archs "$app/Contents/MacOS/WineWrap"
          lipo -archs "$cli"
          # perl's alarm stands in for `timeout`, which macOS lacks; a GUI
          # binary in the CLI's place would otherwise hang here.
          version="$(perl -e 'alarm 30; exec @ARGV' "$cli" --version)"
          echo "$version"
          [[ "$version" == winewrap* ]] || { echo "::error::bundled CLI is not winewrap"; exit 1; }
          perl -e 'alarm 30; exec @ARGV' "$cli" bottle list

          # The CLI tarball must contain the CLI too.
          mkdir "$RUNNER_TEMP/cli" && tar -xzf dist/winewrap-*.tar.gz -C "$RUNNER_TEMP/cli"
          perl -e 'alarm 30; exec @ARGV' "$RUNNER_TEMP"/cli/*/winewrap --version

          # Launch the GUI and make sure it stays up and opens a window.
          "$app/Contents/MacOS/WineWrap" > "$RUNNER_TEMP/gui.log" 2>&1 &
          pid=$!
          sleep 20
          status=0
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::WineWrap exited during startup"
            status=1
          elif ! swift scripts/check-window.swift "$pid"; then
            echo "::error::WineWrap is running but has no window on screen"
            status=1
          fi
          kill "$pid" 2>/dev/null || true
          echo "--- GUI log ---"
          cat "$RUNNER_TEMP/gui.log"
          exit "$status"
      # Builds are delivered as GitHub release files rather than Actions
      # artifacts: release files don't count against the account's (small)
      # artifact storage quota. Every push to master and every manual run
      # replaces the rolling "dev-unsigned" pre-release.
      - name: Publish "dev-unsigned" pre-release
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Unsigned (ad-hoc signed) development build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}.

          Not notarized by Apple: after copying WineWrap.app to Applications, run
          \`xattr -dr com.apple.quarantine /Applications/WineWrap.app\` once.
          See the README section \"Running an unsigned build\"."
          gh release delete dev-unsigned --yes --cleanup-tag || true
          gh release create dev-unsigned dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Development build (unsigned)" --notes "$notes"
          echo "### Download: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/dev-unsigned" >> "$GITHUB_STEP_SUMMARY"
